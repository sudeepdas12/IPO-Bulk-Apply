name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  quality-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & dev tools
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
          pip install pytest pytest-mock ruff mypy

      - name: Run Ruff Lint Checks
        run: |
          python -m ruff check bot/ app/ ../tests/

      - name: Run Mypy Type Analysis
        run: |
          python -m mypy bot app ../tests

      - name: Run Pytest Suite
        run: |
          python -m pytest ../tests/ -v

      - name: Build sdist & wheel
        run: |
          python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: quality-and-test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish package distribution to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
